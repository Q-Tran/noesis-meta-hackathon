    this.alpha = 1;
    this.drag = null;
    this.hover = null;
    this._bind();
    this._loop();
  }

  resize() {
    const dpr = window.devicePixelRatio || 1;
    this.w = this.canvas.clientWidth;
    this.h = this.canvas.clientHeight;
    this.canvas.width = this.w * dpr;
    this.canvas.height = this.h * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  _bind() {
    const pos = e => {
      const rect = this.canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - rect.left, y: p.clientY - rect.top };
    };
    const pick = p => this.nodes.find(n => (n.x - p.x) ** 2 + (n.y - p.y) ** 2 < (n.r + 4) ** 2);

    this.canvas.addEventListener("pointerdown", e => {
      const n = pick(pos(e));
      if (n) { this.drag = n; this.dragMoved = false; this.canvas.classList.add("dragging"); this.canvas.setPointerCapture(e.pointerId); }
    });
    this.canvas.addEventListener("pointermove", e => {
      const p = pos(e);
      if (this.drag) {
        this.drag.x = p.x; this.drag.y = p.y; this.drag.vx = 0; this.drag.vy = 0;
        this.dragMoved = true; this.alpha = Math.max(this.alpha, 0.15);
      } else {
        this.hover = pick(p) || null;
        this.canvas.style.cursor = this.hover ? "pointer" : "grab";
      }
    });
    this.canvas.addEventListener("pointerup", () => {
      if (this.drag && !this.dragMoved && this.drag.id !== this.centerId) openNode(this.drag.id);
      this.drag = null; this.canvas.classList.remove("dragging");
    });
    const onResize = () => {
      if (!document.body.contains(this.canvas)) {
        window.removeEventListener("resize", onResize); // navigated away
        return;
      }
      this.resize();
    };
    window.addEventListener("resize", onResize);
  }

  _tick() {
    const center = this.nodeById.get(this.centerId);
    // Repulsion (cheap O(n²) is fine for ≤ 60 nodes).
    for (let i = 0; i < this.nodes.length; i++) {
      const a = this.nodes[i];
      for (let j = i + 1; j < this.nodes.length; j++) {
        const b = this.nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy || 0.01;
        const min = 900;
        if (d2 < 22000) {
          const f = (min / d2) * this.alpha;
          dx *= f; dy *= f;
          a.vx += dx; a.vy += dy; b.vx -= dx; b.vy -= dy;
        }
      }
    }
    // Springs.
    for (const e of this.edges) {
      const dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const f = (d - 110) * 0.02 * this.alpha;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      e.source.vx += fx; e.source.vy += fy;
      e.target.vx -= fx; e.target.vy -= fy;
    }
    // Gravity toward the canvas center.
    const cx = this.w / 2, cy = this.canvas.height / 2;
    for (const n of this.nodes) {
      if (n === this.drag) continue;
      n.vx += (cx - n.x) * 0.002 * this.alpha;
      n.vy += (cy - n.y) * 0.002 * this.alpha;
      n.vx *= 0.86; n.vy *= 0.86;
      n.x += n.vx; n.y += n.vy;
    }
    if (center) { center.vx += (cx - center.x) * 0.05 * this.alpha; center.vy += (cy - center.y) * 0.05 * this.alpha; }
    this.alpha *= 0.995;
  }

  _draw() {
    const { ctx } = this;
    ctx.clearRect(0, 0, this.w, this.h);
    ctx.lineWidth = 1;
    ctx.font = "10px " + getComputedStyle(document.body).getPropertyValue("--mono");
    for (const e of this.edges) {
      ctx.strokeStyle = "rgba(133,149,167,.35)";
      ctx.beginPath();
      ctx.moveTo(e.source.x, e.source.y);
      ctx.lineTo(e.target.x, e.target.y);
      ctx.stroke();
      // Arrowhead toward the target.
      const a = Math.atan2(e.target.y - e.source.y, e.target.x - e.source.x);
      const tx = e.target.x - Math.cos(a) * (e.target.r + 2), ty = e.target.y - Math.sin(a) * (e.target.r + 2);
      ctx.fillStyle = "rgba(133,149,167,.5)";
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx - Math.cos(a - 0.4) * 6, ty - Math.sin(a - 0.4) * 6);
      ctx.lineTo(tx - Math.cos(a + 0.4) * 6, ty - Math.sin(a + 0.4) * 6);
      ctx.fill();
    }
    for (const n of this.nodes) {
      const isCenter = n.id === this.centerId;
      ctx.fillStyle = labelColor(n.label);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fill();
      if (isCenter || n === this.hover) {
        ctx.strokeStyle = isCenter ? "var(--accent)" : "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      if (isCenter || n === this.hover || this.nodes.length <= 25) {
        ctx.fillStyle = isCenter ? "#fff" : "rgba(219,228,238,.75)";
        ctx.textAlign = "center";
        ctx.fillText(n.title || n.label, n.x, n.y + n.r + 12);
      }
    }
  }

  _loop() {
    const frame = () => {
      if (!document.body.contains(this.canvas)) return; // navigated away
      this._tick();
      this._draw();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
}

/* ============================== ask ============================== */

const ASK_PROMPTS = [
  { label: "What is tool search?", q: "What is tool search and how does it save tokens?" },
  { label: "Metrics on token usage", q: "Which metrics cover token usage?" },
  { label: "Test a correction", q: "The graph says tool search is not available on Chat Completions, grounded in the tool-search docs page. That is stale: tool search launched on Chat Completions this week." },
];

function renderAsk() {
  main.innerHTML = `
    <div id="ask-head"><span class="model-chip" title="chat model: muse-wonder-1.0">✦ chat powered by <b>Muse Wonder</b></span></div>
    <div id="ask-thread">
      <div class="qa"><div class="a-row"><div class="avatar">✦</div><div class="a md"><p>Ask the graph anything — the agent reads the corpus with bounded tools, uses Meta's tool search to pick them, and records every call as a trace span. Corrections are epistemic: challenged or repointed, never deleted, never re-ingested.</p></div></div></div>
    </div>
    <div class="ask-quick" id="ask-quick"></div>
    <form id="ask-form">
      <input id="ask-input" type="text" placeholder="Ask the graph…" autocomplete="off">
      <button class="btn-primary" type="submit" title="Send">↑</button>
    </form>`;
  const quick = $("#ask-quick");
  quick.innerHTML = `<span>try:</span>`;
  for (const p of ASK_PROMPTS) {
    const b = document.createElement("button");
    b.textContent = p.label;
    b.addEventListener("click", () => runAsk(p.q));
    quick.appendChild(b);
  }
  const form = $("#ask-form");
  form.addEventListener("submit", e => {
    e.preventDefault();
    const q = $("#ask-input").value.trim();
    if (!q) return;
    $("#ask-input").value = "";
    runAsk(q);
  });
  $("#ask-input").focus();
}

async function runAsk(q) {
  const thread = $("#ask-thread");
  const qa = document.createElement("div");
  qa.className = "qa";
  qa.innerHTML = `<div class="q">${esc(q)}</div>` +
    `<div class="a-row"><div class="avatar">✦</div>` +
    `<div class="a pending"><span class="typing"><i></i><i></i><i></i></span><span class="ask-status">picking tools and reading the graph — this can take a minute…</span><div class="msg-progress"></div></div></div>`;
  thread.appendChild(qa);
  qa.scrollIntoView({ behavior: "smooth", block: "end" });
  const a = qa.querySelector(".a");
  const progress = qa.querySelector(".msg-progress");
  const status = qa.querySelector(".ask-status");
  let sawEvent = false;
  try {
    let res = null;
    try {
      res = await streamAsk(q, ev => {
        sawEvent = true;
        renderProgressEvent(progress, status, ev);
        qa.scrollIntoView({ behavior: "smooth", block: "end" });
      });
    } catch (streamErr) {
      if (sawEvent) throw streamErr;
      // No stream at all (old server, no body): one-shot, same final render.
      res = await api("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });
    }
    if (!res) throw new Error("the stream ended without an answer");
    renderFinalAnswer(a, qa, res);
  } catch (err) {
    a.className = "a error";
    a.textContent = `The agent could not answer: ${err.message}`;
  }
  qa.scrollIntoView({ behavior: "smooth", block: "end" });
}

// The final answer render -- identical whether the turn streamed or not.
function renderFinalAnswer(a, qa, res) {
  a.className = "a md";
  a.innerHTML = renderMarkdown(res.answer) + renderAskMeta(res);
  const tools = res.tools || [];
  const searchEvents = res.tool_search || [];
  if (res.trace_id && (tools.length || searchEvents.length)) {
    const btn = document.createElement("button");
    btn.className = "msg-tracebtn";
    btn.textContent = `🔍 trace · ${tools.length} tool call${tools.length === 1 ? "" : "s"}` +
      (searchEvents.length ? ` · 🔎 tool search` : "") +
      (res.model ? ` · ${res.model}` : "");
    btn.addEventListener("click", () => showTrace(btn, res.trace_id, qa, searchEvents));
    a.appendChild(btn);
  }
  const dv = a.querySelector(".delta-visual");
  if (dv && res.delta && (res.delta.nodes || []).length) {
    const canvas = document.createElement("canvas");
    dv.appendChild(canvas);
    renderDeltaGraph(canvas, res.delta);
  }
  if ((res.entities || []).length) renderRelatedCard(a, res.entities);
}

async function streamAsk(question, onEvent) {
  const res = await fetch("/api/ask/stream", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question }),
  });
  if (!res.ok || !res.body) throw new Error(`stream failed (${res.status})`);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let finalRes = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf("\n\n")) >= 0) {
      const raw = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      const line = raw.split("\n").find(l => l.startsWith("data:"));
      if (!line) continue;
      const ev = JSON.parse(line.slice(5));
      if (ev.type === "final") finalRes = ev.result;
      else if (ev.type === "error") throw new Error(ev.detail || "the agent failed");
      else onEvent(ev);
    }
  }
  return finalRes;
}

function renderProgressEvent(progress, status, ev) {
  if (!progress) return;
  if (ev.type === "thinking") {
    if (status) status.textContent = `thinking… (step ${ev.iteration})`;
    return;
  }
  if (ev.type === "tool_search") {
    if (status) status.textContent = "Meta tool search picked the tools…";
    const div = document.createElement("div");
    div.className = "msg-toolsearch prog-search";
    div.textContent = `🔎 Meta tool search → loaded ${(ev.loaded || []).join(", ") || "none"}`;
    progress.appendChild(div);
    return;
  }
  if (ev.type === "tool_start") {
    if (status) status.textContent = `running ${ev.name}…`;
    const row = document.createElement("div");
    row.className = "prog-row running";
    row.dataset.name = ev.name;
    row.innerHTML = `<span class="prog-dot"></span><span class="prog-name">${esc(ev.name)}</span><span class="prog-detail">running…</span>`;
    progress.appendChild(row);
    return;
  }
  if (ev.type === "tool_done") {
    if (status) status.textContent = "reading the graph…";
    const rows = progress.querySelectorAll(".prog-row.running");
    const row = [...rows].reverse().find(r => r.dataset.name === ev.name) || [...rows].pop();
    if (!row) return;
    const failed = !!(ev.summary && ev.summary.error);
    row.className = "prog-row done" + (ev.write ? " write" : "") + (failed ? " error" : "");
    row.querySelector(".prog-dot").textContent = failed ? "✕" : "✓";
    const secs = ev.duration_ms >= 1000 ? `${(ev.duration_ms / 1000).toFixed(1)}s` : `${ev.duration_ms}ms`;
    const detail = progSummary(ev.summary);
    row.querySelector(".prog-detail").textContent =
      (ev.write ? "wrote · " : "") + secs + (detail ? ` · ${detail}` : "");
  }
}

function progSummary(s) {
  if (!s) return "";
  if (s.error) return `error: ${String(s.error).slice(0, 60)}`;
  const bits = [];
  if (s.hits != null) bits.push(`${s.hits} hits`);
  if (s.pages && s.pages.length) bits.push(s.pages[0]);
  if (s.entities && s.entities.length) bits.push(s.entities.filter(Boolean).slice(0, 2).join(", "));
  if (s.claim_id) bits.push(s.claim_id);
  if (s.argument_id) bits.push(s.argument_id);
  if (s.attack_argument_id) bits.push(`attacks ${s.attacks || "an argument"}`);
  if (s.concludes) bits.push(`concludes ${s.concludes}`);
  return bits.join(" · ");
}

// A small canvas map: focus nodes on an inner ring, their depth-1 neighbors
// fanned around them. Nodes click through to the corpus map (#n= deep link).
function renderMiniGraph(canvas, data, { keyOf = n => n.element_id, focusKeys = [] } = {}) {
  const nodes = data.nodes || [];
  const edges = (data.edges || []).filter(e => e.source && e.target);
  if (!nodes.length || !canvas.getContext) return;
  const W = canvas.clientWidth || 600, H = canvas.clientHeight || 210;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  const byKey = new Map(nodes.map(n => [keyOf(n), n]));
  const deg = new Map(nodes.map(n => [keyOf(n), 0]));
  for (const e of edges) {
    if (deg.has(e.source)) deg.set(e.source, deg.get(e.source) + 1);
    if (deg.has(e.target)) deg.set(e.target, deg.get(e.target) + 1);
  }
  let focus = focusKeys.filter(k => byKey.has(k));
  if (!focus.length) {
    focus = [...byKey.keys()].sort((a, b) => deg.get(b) - deg.get(a)).slice(0, Math.min(6, nodes.length));
  }
  const focusSet = new Set(focus);
  const cx = W / 2, cy = H / 2;
  const outerR = Math.min(W, H) * 0.40, innerR = focus.length > 2 ? Math.min(W, H) * 0.22 : 0;
  const pos = new Map();
  focus.forEach((k, i) => {
    const a = (i / focus.length) * 2 * Math.PI - Math.PI / 2;
    pos.set(k, { x: cx + innerR * Math.cos(a), y: cy + innerR * Math.sin(a) });
  });
  const angleOf = k => Math.atan2(pos.get(k).y - cy, pos.get(k).x - cx);
  const grouped = new Map(focus.map(k => [k, []]));
  const stray = [];
  for (const n of nodes) {
    const k = keyOf(n);
    if (focusSet.has(k)) continue;
    const link = edges.find(e => (e.source === k && focusSet.has(e.target)) || (e.target === k && focusSet.has(e.source)));
    const fk = link ? (focusSet.has(link.source) ? link.source : link.target) : null;
    if (fk) grouped.get(fk).push(n); else stray.push(n);
  }
  for (const fk of focus) {
    const g = grouped.get(fk), base = angleOf(fk);
    const spread = Math.min(Math.max(g.length - 1, 0), 5) * 0.26;
    g.forEach((n, j) => {
      const a = g.length === 1 ? base : base - spread / 2 + spread * (j / (g.length - 1));
      pos.set(keyOf(n), { x: cx + outerR * Math.cos(a), y: cy + outerR * Math.sin(a) });
    });
  }
  stray.forEach((n, j) => {
    const a = (j / Math.max(stray.length, 1)) * 2 * Math.PI + 0.3;
    pos.set(keyOf(n), { x: cx + outerR * Math.cos(a), y: cy + outerR * Math.sin(a) });
  });
  const MARK_COLORS = { "+": "#4ade80", "⚔": "#f87171", "Δ": "#ffc247", "✓": "#5eead4" };
  for (const e of edges) {
    const s = pos.get(e.source), t = pos.get(e.target);
    if (!s || !t) continue;
    ctx.strokeStyle = e.mark ? (MARK_COLORS[e.mark] || "#8b98b8") : "rgba(139,152,184,.45)";
    ctx.globalAlpha = e.mark ? 0.85 : 1;
    ctx.lineWidth = e.mark ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(t.x, t.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const hit = [];
  for (const n of nodes) {
    const k = keyOf(n), p = pos.get(k);
    if (!p) continue;
    const isFocus = focusSet.has(k);
    const r = isFocus ? 7 : 4.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 2 * Math.PI);
    ctx.fillStyle = MARK_COLORS[n.mark] || labelColor(n.label);
    ctx.fill();
    if (isFocus) { ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = 1.4; ctx.stroke(); }
    if (isFocus || n.mark) {
      const title = String(n.title || k);
      ctx.fillStyle = "rgba(203,213,235,.85)";
      ctx.font = "9px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText(title.length > 26 ? title.slice(0, 25) + "…" : title, p.x, p.y + r + 11);
    }
    hit.push({ x: p.x, y: p.y, node: n });
  }
  canvas.addEventListener("click", ev => {
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    let best = null, bd = 12;
    for (const h of hit) {
      const d = Math.hypot(h.x - mx, h.y - my);
      if (d < bd) { bd = d; best = h.node; }
    }
    if (best && best.element_id) location.hash = `#n=${best.element_id}`;
  });
}

// The delta payload lists only the turn's own nodes; edges reaching a
// pre-existing entity (e.g. what the new argument concludes) name it without a
// node row. Derive those context nodes so every delta edge can draw.
function deltaVisualData(delta) {
  const nodes = [...(delta.nodes || [])];
  const seen = new Set(nodes.map(n => n.id));
  for (const e of delta.edges || []) {
    for (const [id, label, title] of [[e.source, e.source_label, e.source_title], [e.target, e.target_label, e.target_title]]) {
      if (id && !seen.has(id)) { seen.add(id); nodes.push({ id, label, title: title || id }); }
    }
  }
  return { nodes, edges: delta.edges || [] };
}

// The delta as a story, not a hairball: premise claims on the left, arguments
// in the middle, what they conclude on the right. Created nodes are big and
// green (+), the challenged red (⚔), the superseded amber (Δ); context is
// small and gray. Provenance grounding (FOUND_IN, traces, chunks) is left to
// the text rows -- it is noise in the picture.
function renderDeltaGraph(canvas, delta) {
  const PROV_LABELS = new Set(["RoutingTrace", "Chunk", "SourceNode", "Span", "Session", "TraceOutcome"]);
  const DROP_EDGES = new Set(["FOUND_IN", "EXTRACTED_FROM", "PART_OF"]);
  const data = deltaVisualData(delta);
  const story = data.nodes.filter(n => n.mark);
  const context = data.nodes.filter(n => !n.mark && !PROV_LABELS.has(n.label));
  const edges = data.edges.filter(e => !DROP_EDGES.has(e.type));
  const nodes = [...story, ...context];
  if (!story.length || !canvas.getContext) return;
  const W = canvas.clientWidth || 600, H = canvas.clientHeight || 210;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const byId = new Map(nodes.map(n => [n.id, n]));
  const colOf = n => n.label === "Claim" ? 0 : n.label === "Argument" ? 1 : 2;
  const colX = [W * 0.17, W * 0.5, W * 0.83];
  const cols = [[], [], []];
  for (const n of nodes) cols[colOf(n)].push(n);
  const pos = new Map();
  for (let c = 0; c < 3; c++) {
    const col = cols[c];
    col.sort((a, b) => (b.mark ? 1 : 0) - (a.mark ? 1 : 0));
    const gap = Math.min(66, (H - 46) / Math.max(col.length, 1));
    const y0 = H / 2 - gap * (col.length - 1) / 2;
    col.forEach((n, i) => pos.set(n.id, { x: colX[c], y: y0 + i * gap }));
  }
  const MARK_COLORS = { "+": "#4ade80", "⚔": "#f87171", "Δ": "#ffc247", "✓": "#5eead4" };
  const edgeLabel = { ATTACKS: "attacks", CONCLUDES: "concludes", USES_PREMISE: "on premise", SUPERSEDES: "supersedes", SUPERSEDED_BY: "superseded by" };
  const arrow = (from, to, color, targetNode) => {
    const a = Math.atan2(to.y - from.y, to.x - from.x);
    const r = targetNode && targetNode.mark ? 12 : 6;
    const tx = to.x - r * Math.cos(a), ty = to.y - r * Math.sin(a);
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.lineTo(tx - 7 * Math.cos(a - 0.42), ty - 7 * Math.sin(a - 0.42));
    ctx.lineTo(tx - 7 * Math.cos(a + 0.42), ty - 7 * Math.sin(a + 0.42));
    ctx.closePath(); ctx.fill();
  };
  for (const e of edges) {
    const s = pos.get(e.source), t = pos.get(e.target);
    if (!s || !t) continue;
    const color = MARK_COLORS[e.mark] || "#8b98b8";
    const sameCol = Math.abs(s.x - t.x) < 1;
    ctx.strokeStyle = color; ctx.globalAlpha = e.mark ? 0.9 : 0.4; ctx.lineWidth = e.mark ? 1.8 : 1;
    ctx.beginPath();
    if (sameCol) {
      const mx = s.x + 46, my = (s.y + t.y) / 2;
      ctx.moveTo(s.x, s.y); ctx.quadraticCurveTo(mx, my, t.x, t.y);
      ctx.stroke();
      const a = Math.atan2(t.y - my, t.x - mx);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(t.x, t.y);
      ctx.lineTo(t.x - 7 * Math.cos(a - 0.42), t.y - 7 * Math.sin(a - 0.42));
      ctx.lineTo(t.x - 7 * Math.cos(a + 0.42), t.y - 7 * Math.sin(a + 0.42));
      ctx.closePath(); ctx.fill();
    } else {
      ctx.moveTo(s.x, s.y); ctx.lineTo(t.x, t.y); ctx.stroke();
      arrow(s, t, color, byId.get(e.target));
    }
    if (e.mark && edgeLabel[e.type]) {
      const mx = sameCol ? s.x + 40 : (s.x + t.x) / 2, my = (s.y + t.y) / 2 - 5;
      ctx.globalAlpha = 1; ctx.fillStyle = color;
      ctx.font = "8.5px ui-monospace, monospace"; ctx.textAlign = "center";
      ctx.fillText(edgeLabel[e.type], mx, my);
    }
    ctx.globalAlpha = 1;
  }
  const roleOf = n => {
    if (n.label !== "Argument") return null;
    if (edges.some(e => e.type === "ATTACKS" && e.source === n.id)) return "the challenge";
    if (n.mark === "⚔") return "challenged";
    if (n.mark === "Δ") return "superseded";
    return "new argument";
  };
  const labelLines = n => {
    const role = roleOf(n);
    const text = role || String(n.title || n.id);
    const words = text.split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = "";
    for (const w of words) {
      if (cur && (cur + " " + w).length > 22) { lines.push(cur); cur = w; if (lines.length === 2) break; }
      else cur = cur ? cur + " " + w : w;
    }
    if (cur && lines.length < 2) lines.push(cur);
    else if (cur) lines[1] = lines[1].slice(0, 21) + "…";
    return lines;
  };
  for (const n of nodes) {
    const p = pos.get(n.id);
    if (!p) continue;
    if (n.mark) {
      ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, 2 * Math.PI);
      ctx.fillStyle = MARK_COLORS[n.mark] || labelColor(n.label);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = "#0b0f14"; ctx.font = "bold 10px ui-monospace, monospace"; ctx.textAlign = "center";
      ctx.fillText(n.mark, p.x, p.y + 3.5);
      ctx.fillStyle = "rgba(203,213,235,.92)"; ctx.font = "9px ui-monospace, monospace";
      labelLines(n).forEach((line, i) => ctx.fillText(line, p.x, p.y + 22 + i * 11));
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, 2 * Math.PI);
      ctx.fillStyle = "#414d66"; ctx.fill();
      if (n.label !== "Claim" && n.label !== "Argument") {
        const t = String(n.title || n.id);
        ctx.fillStyle = "rgba(139,152,184,.8)"; ctx.font = "8.5px ui-monospace, monospace"; ctx.textAlign = "center";
        ctx.fillText(t.length > 20 ? t.slice(0, 19) + "…" : t, p.x, p.y + 16);
      }
    }
  }
  canvas.addEventListener("click", ev => {
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    let best = null, bd = 14;
    for (const n of nodes) {
      const p = pos.get(n.id);
      if (!p || !n.element_id) continue;
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d < bd) { bd = d; best = n; }
    }
    if (best) location.hash = `#n=${best.element_id}`;
  });
}

// The depth-1 map of the entities the agent surfaced through search this turn.
async function renderRelatedCard(a, entities) {
  const card = document.createElement("div");
  card.className = "mini-graph";
  card.innerHTML = `<div class="mini-head">on the graph · ${entities.length} ${entities.length === 1 ? "entity" : "entities"} touched · depth 1</div>`;
  const canvas = document.createElement("canvas");
  card.appendChild(canvas);
  a.appendChild(card);
  try {
    const data = await api("/api/graph/related", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: entities.map(e => e.id), per_node: 3 }),
    });
    renderMiniGraph(canvas, data, { focusKeys: data.centers || [] });
  } catch {
    card.remove();
  }
}

function renderAskMeta(res) {
  const tools = res.tools || [];
  const chips = tools.length
    ? `<div class="msg-tools">${tools.map(t => `<span class="tchip">${esc(t.name || t)}</span>`).join("")}</div>`
    : "";
  const writes = (res.writes || []).map(w =>
    w.claim_id || w.argument_id || w.relationship || w.updated || w.name).filter(Boolean);
  const receipts = writes.length ? `<div class="msg-writes">wrote ${esc(writes.join(" · "))}</div>` : "";
  return chips + receipts + renderDeltaCard(res.delta);
}

function renderDeltaCard(delta) {
  if (!delta || !(delta.explanation || []).length) return "";
  const rows = delta.explanation.map(x =>
    `<div class="delta-row"><span class="mark m-${esc(x.mark)}">${esc(x.mark)}</span>` +
    `<span><b>${esc(x.text)}</b>` +
    (x.why ? `<span class="why">${esc(x.why)}</span>` : "") +
    `</span></div>`).join("");
  const created = (delta.nodes || []).filter(n => n.mark === "+").length;
  const attacked = (delta.nodes || []).filter(n => n.mark === "⚔").length;
  const superseded = (delta.nodes || []).filter(n => n.mark === "Δ").length;
  const legend = [
    created ? `<span style="color:#4ade80">●</span> ${created} added` : "",
    attacked ? `<span style="color:#f87171">●</span> ${attacked} challenged` : "",
    superseded ? `<span style="color:#ffc247">●</span> ${superseded} superseded` : "",
  ].filter(Boolean).join(" · ");
  return `<div class="delta-card">` +
    `<div class="delta-head">graph changes · ${legend} · nothing deleted</div>` +
    `<div class="delta-visual"></div>` +
    rows + `</div>`;
}

async function showTrace(btn, traceId, qa, searchEvents = []) {
  const existing = qa.querySelector(".msg-trace");
  if (existing) { existing.remove(); return; }
  btn.disabled = true;
  try {
    const data = await api(`/api/trace/${encodeURIComponent(traceId)}`);
    const div = document.createElement("div");
    div.className = "msg-trace";
    const searchHtml = searchEvents.length
      ? `<div class="msg-toolsearch">${searchEvents.map(e =>
          `🔎 Meta tool search · ${esc(JSON.stringify(e.searched || {}))} → loaded ${esc((e.loaded || []).join(", ") || "none")}`).join("<br>")}</div>`
      : "";
    div.innerHTML = searchHtml + ((data.spans || []).map(s =>
      `<div class="trace-span"><b>${esc(s.name)}</b> · ${s.duration_ms ?? "?"}ms` +
      (s.status === "error" ? ` · <span class="err">${esc(String(s.error || "").slice(0, 90))}</span>` : "") +
      (s.raw_input ? `<span class="trace-io">${esc(JSON.stringify(s.raw_input).slice(0, 140))}</span>` : "") +
      `</div>`).join("")
      || `<div class="trace-span">no spans recorded for this turn</div>`);
    btn.parentNode.appendChild(div);
    qa.scrollIntoView({ behavior: "smooth", block: "end" });
  } catch (e) {
    btn.textContent = `trace failed: ${String(e.message || e).slice(0, 40)}`;
  } finally {
    btn.disabled = false;
  }
}

/* Minimal, safe markdown: escape HTML first, then structure. No raw HTML passthrough. */
function renderMarkdown(src) {
  const codeBlocks = [];
  let text = String(src ?? "").replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    codeBlocks.push(`<pre><code class="lang-${esc(lang)}">${esc(code.replace(/\n$/, ""))}</code></pre>`);
    return `${codeBlocks.length - 1}`;
  });
  text = esc(text);
  text = text.replace(/`([^`\n]+)`/g, (_, code) => `<code>${code}</code>`);
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, `<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>`);
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/(^|\s)\*([^*\n]+)\*/g, "$1<em>$2</em>");

  const lines = text.split("\n");
  const out = [];
  let list = null, table = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const closeTable = () => { if (table) { out.push("</table>"); table = null; } };

  for (const line of lines) {
    const trimmed = line.trim();
    const block = trimmed.match(/^(\d+)$/);
    if (block && codeBlocks[+block[1]] !== undefined) { closeList(); closeTable(); out.push(codeBlocks[+block[1]]); continue; }
    if (!trimmed) { closeList(); closeTable(); continue; }
    const h = trimmed.match(/^(#{1,3})\s+(.*)$/);
    if (h) { closeList(); closeTable(); out.push(`<h${h[1].length}>${h[2]}</h${h[1].length}>`); continue; }
    if (trimmed.startsWith("|") && trimmed.endsWith("|")) {
      closeList();
      const cells = trimmed.slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^:?-{3,}:?$/.test(c))) continue; // separator row
      if (!table) { table = true; out.push("<table>"); out.push(`<tr>${cells.map(c => `<th>${c}</th>`).join("")}</tr>`); }
      else out.push(`<tr>${cells.map(c => `<td>${c}</td>`).join("")}</tr>`);
      continue;
    }
    closeTable();
    const ul = trimmed.match(/^[-*•]\s+(.*)$/);
    if (ul) { if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${ul[1]}</li>`); continue; }
    const ol = trimmed.match(/^\d+[.)]\s+(.*)$/);
    if (ol) { if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${ol[1]}</li>`); continue; }
    if (trimmed.startsWith("&gt;")) { closeList(); out.push(`<blockquote>${trimmed.slice(4).trim()}</blockquote>`); continue; }
    closeList();
    out.push(`<p>${trimmed}</p>`);
  }
  closeList(); closeTable();
  return out.join("\n");
}

/* ============================== boot ============================== */

renderSidebar();
setView(state.view);

// Deep link: #n=<elementId> opens that node; #view=<graph|dashboard|ask>
// opens a tab (the landing page's feature cards point here).
if (location.hash.startsWith("#n=")) {
  const eid = decodeURIComponent(location.hash.slice(3));
  if (eid) openNode(eid);
} else if (location.hash.startsWith("#view=")) {
  const view = decodeURIComponent(location.hash.slice(6));
  if (["graph", "dashboard", "ask"].includes(view)) setView(view);
}
